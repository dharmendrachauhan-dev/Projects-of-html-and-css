<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
          <aside>
            <div class="bars">
                <img src="./Icons/bars.svg" alt="">
            </div>
            <div class="side-icons">
                <i>
                    <img src="./Icons/home.svg" alt="Home">
                </i>
                <p>Home</p>
            </div>
            <div class="side-icons">
                <i>
                    <img src="./Icons/compass.svg" alt="Home">
                </i>
                <p>Home</p>
            </div>
            <div class="side-icons">
                <i>
                    <img src="./Icons/video-gallary.svg" alt="Home">
                </i>
                <p>Add Subscription</p>
            </div>
            <div class="side-icons">
                <i>
                    <img src="./Icons/video-library.svg" alt="Home">
                </i>
                <p>Home</p>
            </div>
        </aside>
        <header>
            <nav>
                <div class="logo">
                    <img src="./Image/youtube-logo.png" alt="Youtube Logo">
                </div>
                <div class="center-nav">
                    <div class="search">
                        <input type="text" />
                        <button>
                            <img src="./Icons/search.svg" alt="Search Icon">
                        </button>
                    </div>
                    <div class="mic">
                        <img src="./Icons/mic.svg" alt="mic">
                    </div>
                </div>
                <div class="side-nav">
                    <i>
                        <img src="./Icons/video-add.svg" alt="Upload Video">
                    </i>
                    <i>
                        <img src="./Icons/dot-grid.svg" alt="Grid Dot">
                    </i>
                    <i>
                        <img src="./Icons/bell.svg" alt="Notification bell">
                    </i>
                    <i>
                        <img src="./Image/avatar.png" alt="User Avatar">
                    </i>
                </div>
            </nav>
            <div class="tags">
                <div class="tag dark">All</div>
                <div class="tag light">Techcrunch</div>
                <div class="tag light">Html</div>
                <div class="tag light">ReactJs</div>
                <div class="tag light">Binary search</div>
                <div class="tag light">Tailwind Css</div>
            </div>
        </header>
    </div>
</body>

</html>
